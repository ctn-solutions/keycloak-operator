<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Keycloak Operator — Keycloak configuration as code on Kubernetes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02071b"/>
      <stop offset="1" stop-color="#0022a4" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d52de"/>
      <stop offset="1" stop-color="#d6e7ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d6e7ff" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#1d52de" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1d52de" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- Kubernetes heptagon + gear teeth, abstract -->
  <g transform="translate(985,150)" fill="none" stroke="#1d52de" stroke-width="3">
    <g stroke="#d6e7ff" stroke-opacity="0.55">
      <path d="M0-78 13-71 13-57 -13-57 -13-71Z" transform="rotate(0)"/>
      <path d="M0-78 13-71 13-57 -13-57 -13-71Z" transform="rotate(51.4)"/>
      <path d="M0-78 13-71 13-57 -13-57 -13-71Z" transform="rotate(102.9)"/>
      <path d="M0-78 13-71 13-57 -13-57 -13-71Z" transform="rotate(154.3)"/>
      <path d="M0-78 13-71 13-57 -13-57 -13-71Z" transform="rotate(205.7)"/>
      <path d="M0-78 13-71 13-57 -13-57 -13-71Z" transform="rotate(257.1)"/>
      <path d="M0-78 13-71 13-57 -13-57 -13-71Z" transform="rotate(308.6)"/>
    </g>
    <path d="M0-64 55-32 55 32 0 64 -55 32 -55-32Z" stroke-width="4"/>
    <!-- key shaft and bit inside the heptagon -->
    <g stroke="url(#accent)" stroke-width="7" stroke-linecap="round">
      <path d="M-26 22 18-22"/>
      <path d="M18-22 26-14"/>
      <path d="M8-12 14-6"/>
      <circle cx="-30" cy="26" r="8"/>
    </g>
  </g>

  <!-- connection lines: CRDs to the cluster -->
  <g stroke="#d6e7ff" stroke-opacity="0.25" stroke-dasharray="2 6">
    <path d="M760 96 H918"/>
    <path d="M760 150 H918"/>
    <path d="M760 204 H918"/>
  </g>
  <g fill="#1d52de">
    <rect x="742" y="86" width="18" height="18" rx="3"/>
    <rect x="742" y="141" width="18" height="18" rx="3"/>
    <rect x="742" y="195" width="18" height="18" rx="3"/>
  </g>
  <g fill="#d6e7ff" fill-opacity="0.85" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <text x="770" y="99">realm</text>
    <text x="770" y="154">client</text>
    <text x="770" y="208">identity-provider</text>
  </g>

  <!-- wordmark -->
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="128" fill="#fdfeff" font-size="58" font-weight="700" letter-spacing="-1">Keycloak</text>
    <text x="72" y="128" fill="#1d52de" font-size="58" font-weight="700" letter-spacing="-1" dx="312">Operator</text>
    <rect x="74" y="152" width="132" height="4" fill="url(#accent)"/>
    <text x="72" y="196" fill="#d6e7ff" fill-opacity="0.9" font-size="21">Keycloak configuration as code,</text>
    <text x="72" y="224" fill="#d6e7ff" fill-opacity="0.9" font-size="21">declaratively managed on Kubernetes</text>
  </g>

  <!-- CTN Solutions mark -->
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#d6e7ff" fill-opacity="0.65">
    <text x="72" y="268">a CTN Solutions project</text>
  </g>
  <rect x="72" y="276" width="1056" height="1" fill="#d6e7ff" fill-opacity="0.15"/>
</svg>
