---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: identityproviders.keycloak.ctn-solutions.io
spec:
  group: keycloak.ctn-solutions.io
  names:
    categories:
    - keycloak
    kind: IdentityProvider
    listKind: IdentityProviderList
    plural: identityproviders
    shortNames:
    - kcidp
    singular: identityprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.alias
      name: Alias
      type: string
    - jsonPath: .spec.providerId
      name: Provider
      type: string
    - jsonPath: .spec.realm
      name: Realm
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IdentityProvider manages an identity provider (broker) on a Keycloak
          server. The spec mirrors the Keycloak IdentityProviderRepresentation; see
          the Keycloak server documentation for field semantics.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              IdentityProviderSpec defines the desired state of an IdentityProvider.
              Fields mirror the Keycloak IdentityProviderRepresentation one-to-one. The
              provider-specific "config" map carries the broker configuration; sensitive
              entries such as "clientSecret" should be injected through ConfigSecretRef
              instead of being written inline.
            properties:
              addReadTokenRoleOnCreate:
                type: boolean
              adoptionPolicy:
                description: |-
                  AdoptionPolicy controls the behaviour when an identity provider with
                  the same alias already exists. Defaults to CreateOnly.
                enum:
                - CreateOnly
                - Adopt
                - FailIfExists
                type: string
              alias:
                description: |-
                  Alias is the unique identifier of the identity provider within the
                  realm.
                minLength: 1
                type: string
              config:
                additionalProperties:
                  type: string
                description: |-
                  Config holds the provider-specific configuration, for example
                  {"authorizationUrl": "...", "tokenUrl": "...", "clientId": "..."}.
                type: object
              configSecretRef:
                description: |-
                  ConfigSecretRef injects sensitive config values from a Secret. Keys
                  maps a config entry (for example "clientSecret") to the Secret key
                  holding its value.
                properties:
                  keys:
                    additionalProperties:
                      type: string
                    description: |-
                      Keys maps a target configuration key to the Secret key holding its
                      value.
                    minProperties: 1
                    type: object
                  name:
                    description: Name of the Secret.
                    minLength: 1
                    type: string
                required:
                - keys
                - name
                type: object
              deletionPolicy:
                description: |-
                  DeletionPolicy controls whether the identity provider is deleted from
                  the server when this resource is deleted. Defaults to Delete.
                enum:
                - Orphan
                - Delete
                type: string
              displayName:
                type: string
              enabled:
                type: boolean
              firstBrokerLoginFlowAlias:
                type: string
              keycloakRef:
                description: |-
                  KeycloakRef points to the KeycloakConnection managing this identity
                  provider.
                properties:
                  name:
                    description: Name of the KeycloakConnection resource.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              linkOnly:
                type: boolean
              mappers:
                items:
                  description: |-
                    IdentityProviderMapper mirrors the Keycloak
                    IdentityProviderMapperRepresentation.
                  properties:
                    config:
                      additionalProperties:
                        type: string
                      type: object
                    identityProviderMapper:
                      type: string
                    name:
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
              postBrokerLoginFlowAlias:
                type: string
              providerId:
                description: |-
                  ProviderID is the Keycloak provider type, for example "oidc", "saml",
                  "google" or "github".
                minLength: 1
                type: string
              realm:
                description: Realm is the name of the realm the identity provider
                  lives in.
                minLength: 1
                type: string
              storeToken:
                type: boolean
              trustEmail:
                type: boolean
            required:
            - alias
            - keycloakRef
            - providerId
            - realm
            type: object
          status:
            description: ResourceStatus is the shared status block of all managed
              resources.
            properties:
              conditions:
                description: Conditions report the outcome of the latest reconciliation.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the generation most recently processed.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
