    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KeycloakConnection describes a Keycloak server and the credentials used to
          administer it. All managed resources reference a connection through
          spec.keycloakRef.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KeycloakConnectionSpec defines the desired state of a KeycloakConnection.
            properties:
              adminRealm:
                description: |-
                  AdminRealm is the realm the administration credentials live in.
                  Defaults to "master".
                type: string
              auth:
                description: Auth selects the authentication method. Defaults to "password".
                enum:
