{{- if .Values.metrics.service.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "keycloak-operator.fullname" . }}-metrics
  labels:
    {{- include "keycloak-operator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.metrics.service.type }}
  selector:
    {{- include "keycloak-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: {{ ternary "https-metrics" "http-metrics" .Values.metrics.secure }}
      port: {{ .Values.metrics.service.port }}
      targetPort: {{ ternary "https-metrics" "http-metrics" .Values.metrics.secure }}
{{- end }}
