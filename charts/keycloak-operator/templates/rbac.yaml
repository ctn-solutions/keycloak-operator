{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "keycloak-operator.fullname" . }}
  labels:
    {{- include "keycloak-operator.labels" . | nindent 4 }}
rules:
  # Connection credentials are read from Secrets; exported client secrets
  # (secretOutput) are written next to the resources that own them.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  # Leader election.
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Kubernetes events emitted by controllers.
  - apiGroups:
      - ""
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
  # CRUD on the operator's managed Keycloak resources.
  - apiGroups:
      - keycloak.ctn-solutions.io
    resources:
      - clients
      - clientscopes
      - groups
      - identityproviders
      - realmroles
      - realms
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Connections are read-only: the operator never creates or modifies them.
  - apiGroups:
      - keycloak.ctn-solutions.io
    resources:
      - keycloakconnections
    verbs:
      - get
      - list
      - watch
  # Status subresources.
  - apiGroups:
      - keycloak.ctn-solutions.io
    resources:
      - clients/status
      - clientscopes/status
      - groups/status
      - identityproviders/status
      - keycloakconnections/status
      - realmroles/status
      - realms/status
    verbs:
      - get
      - patch
      - update
  # Finalizer updates for graceful deletion.
  - apiGroups:
      - keycloak.ctn-solutions.io
    resources:
      - clients/finalizers
      - clientscopes/finalizers
      - groups/finalizers
      - identityproviders/finalizers
      - keycloakconnections/finalizers
      - realmroles/finalizers
      - realms/finalizers
    verbs:
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "keycloak-operator.fullname" . }}
  labels:
    {{- include "keycloak-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "keycloak-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "keycloak-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
