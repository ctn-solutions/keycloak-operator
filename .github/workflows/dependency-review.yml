# Review dependency changes on pull requests for known vulnerabilities and
# prohibited licenses.
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e # v4
      - uses: actions/dependency-review-action@1e966ba708e4 # v4
