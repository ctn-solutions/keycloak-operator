# OpenSSF Scorecard: weekly supply-chain security assessment.
name: Scorecard

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@f548e57e544e # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@e8e61e86ea0a # v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93 # v4
        with:
          name: scorecard-results
          path: results.sarif
      - uses: github/codeql-action/upload-sarif@6f530319d8c9 # v3
        with:
          sarif_file: results.sarif
