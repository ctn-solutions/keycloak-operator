# Release pipeline: triggered by pushing a v* tag. Builds and signs a
# multi-arch image, publishes the Helm chart as an OCI artifact and creates
# a GitHub release with the install bundle.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The release is gated on the full integration suite against a matrix of
  # supported Keycloak servers, running on the tagged commit.
  integration:
    name: Integration (Keycloak ${{ matrix.keycloak }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        keycloak: ["26.0", "26.1", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - uses: actions/setup-go@fba3fb4ead8c8e09a06f1d32ae5436e5818eff15 # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Create kind cluster
        uses: helm/kind-action@c72b4750145dbfb1c71734c3782a4db35a1c65c0 # v1
        with:
          cluster_name: kind
      - name: Run integration suite
        env:
          CI: "true"
          KC_VERSION: ${{ matrix.keycloak }}
        run: bash test/e2e/e2e.sh

  build:
    needs: integration
    name: Build, sign and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write          # GitHub release
      packages: write          # GHCR push
      id-token: write          # keyless cosign / provenance
      attestations: write      # build provenance attestations
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

      # The tag name is interpolated into shell commands and Docker build
      # args below; refuse anything that is not a plain semver tag.
      - name: Validate the tag
        run: '[[ "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag ${TAG_NAME} is not vX.Y.Z"; exit 1; }'

      - uses: actions/setup-go@fba3fb4ead8c8e09a06f1d32ae5436e5818eff15 # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@288220e341e5c445ddb6d73e19a57a9012ceca88 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v3

      - name: Log in to GHCR
        uses: docker/login-action@0a596b2e7a325f0cedf8e9bd21ab002cbd3c9241 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@703896b4f30f62d53f5530a80bcdc589a3f702bc # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{raw}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image (multi-arch, with SBOM and provenance)
        id: push
        uses: docker/build-push-action@2ca78c6bec76527009825f31aae0532b4d40d820 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.TAG_NAME }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@874852de93c66509b01dc7cd80f7a5385182d017 # v3

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # GitHub-native attestations require a public repository or an
      # upgraded plan; the buildx SBOM/provenance attestations and the
      # cosign signature above already cover the supply chain. The step
      # activates automatically when the repository goes public.
      - name: Generate build provenance attestation (GitHub)
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Publish Helm chart (OCI)
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - name: Push chart
        env:
          VERSION: ${{ env.TAG_NAME }}
        run: |
          helm package charts/keycloak-operator --version "${VERSION#v}" --app-version "${VERSION#v}"
          helm push "keycloak-operator-${VERSION#v}.tgz" "oci://${REGISTRY}/${{ github.repository_owner }}/charts"

      # The OCI chart package may be private (GHCR packages default to
      # private); attach the packaged chart to the release as well so the
      # tarball is always publicly downloadable.
      - name: Attach the chart tarball to the release
        run: |
          gh release upload "${TAG_NAME}" "keycloak-operator-${VERSION#v}.tgz" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.TAG_NAME }}

      - name: Build the plain-Kubernetes install bundle
        run: |
          make build-installer IMG="${REGISTRY}/${IMAGE_NAME}:${TAG_NAME}"
          cp install.sh "dist/install.sh"
          cp dist/install.yaml "dist/install-${TAG_NAME}.yaml"
          (cd dist && sha256sum install.yaml "install-${TAG_NAME}.yaml" install.sh > sha256sums.txt)

      # The checksums manifest is what the installer trusts; sign it so its
      # authenticity does not depend on GitHub alone. cosign verify-blob
      # instructions are in SECURITY.md.
      - name: Sign the checksums manifest (keyless)
        run: |
          cosign sign-blob --yes \
            --bundle "dist/sha256sums.txt.cosign.bundle" \
            "dist/sha256sums.txt"

      - name: Create GitHub release
        uses: softprops/action-gh-release@e5ee6bc58a36b838b92fc1217f2e4b414b5abcc8 # v2
        with:
          generate_release_notes: true
          files: |
            dist/install.sh
            dist/install.yaml
            dist/install-*.yaml
            dist/sha256sums.txt
            dist/sha256sums.txt.cosign.bundle
