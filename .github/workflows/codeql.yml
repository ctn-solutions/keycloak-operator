# CodeQL security scanning of the Go code.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@f548e57e544e # v4
      - uses: actions/setup-go@fba3fb4ead8c # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: github/codeql-action/init@6f530319d8c9 # v3
        with:
          languages: go
      - uses: github/codeql-action/autobuild@6f530319d8c9 # v3
      - uses: github/codeql-action/analyze@6f530319d8c9 # v3
