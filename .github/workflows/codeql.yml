# CodeQL security scanning of the Go code.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    # Code scanning uploads require GitHub Advanced Security, available on
    # public repositories; the workflow activates automatically when the
    # repository is made public.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - uses: actions/setup-go@fba3fb4ead8c8e09a06f1d32ae5436e5818eff15 # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: github/codeql-action/init@6f530319d8c989665d0835536ec9571735fd2008 # v3
        with:
          languages: go
      - uses: github/codeql-action/autobuild@6f530319d8c989665d0835536ec9571735fd2008 # v3
      - uses: github/codeql-action/analyze@6f530319d8c989665d0835536ec9571735fd2008 # v3
