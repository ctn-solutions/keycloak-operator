# Connection to the Keycloak server. The credentials Secret must live in the
# same namespace and provide "username" and "password" keys (for auth:
# password) or "clientId"/"clientSecret" (for auth: client).
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-credentials
  namespace: keycloak-system
stringData:
  username: admin
  password: admin
---
apiVersion: keycloak.ctn-solutions.io/v1alpha1
kind: KeycloakConnection
metadata:
  name: production
  namespace: keycloak-system
spec:
  url: http://keycloak.keycloak-e2e.svc.cluster.local:8080
  credentialsSecretRef: keycloak-admin-credentials
  # auth: client            # use a service-account client instead of a user
  # adminRealm: master      # realm holding the admin credentials
  # tls:
  #   insecureSkipVerify: false
