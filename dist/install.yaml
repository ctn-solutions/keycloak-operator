apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: identityproviders.keycloak.ctn-solutions.io
spec:
  group: keycloak.ctn-solutions.io
  names:
    categories:
    - keycloak
    kind: IdentityProvider
    listKind: IdentityProviderList
    plural: identityproviders
    shortNames:
    - kcidp
    singular: identityprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.alias
      name: Alias
      type: string
    - jsonPath: .spec.providerId
      name: Provider
      type: string
    - jsonPath: .spec.realm
      name: Realm
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IdentityProvider manages an identity provider (broker) on a Keycloak
          server. The spec mirrors the Keycloak IdentityProviderRepresentation; see
          the Keycloak server documentation for field semantics.

          Inline secrets are rejected: the broker client secret belongs in a Secret
          referenced by spec.configSecretRef.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              IdentityProviderSpec defines the desired state of an IdentityProvider.
              Fields mirror the Keycloak IdentityProviderRepresentation one-to-one. The
              provider-specific "config" map carries the broker configuration; sensitive
              entries such as "clientSecret" should be injected through ConfigSecretRef
              instead of being written inline.
            properties:
              addReadTokenRoleOnCreate:
                type: boolean
              adoptionPolicy:
                description: |-
                  AdoptionPolicy controls the behaviour when an identity provider with
                  the same alias already exists. Defaults to CreateOnly.
                enum:
                - CreateOnly
                - Adopt
                - FailIfExists
                type: string
              alias:
                description: |-
                  Alias is the unique identifier of the identity provider within the
                  realm.
                minLength: 1
                type: string
              config:
                additionalProperties:
                  type: string
                description: |-
                  Config holds the provider-specific configuration, for example
                  {"authorizationUrl": "...", "tokenUrl": "...", "clientId": "..."}.
                type: object
              configSecretRef:
                description: |-
                  ConfigSecretRef injects sensitive config values from a Secret. Keys
                  maps a config entry (for example "clientSecret") to the Secret key
                  holding its value.
                properties:
                  keys:
                    additionalProperties:
                      type: string
                    description: |-
                      Keys maps a target configuration key to the Secret key holding its
                      value.
                    minProperties: 1
                    type: object
                  name:
                    description: Name of the Secret.
                    minLength: 1
                    type: string
                required:
                - keys
                - name
                type: object
              deletionPolicy:
                description: |-
                  DeletionPolicy controls whether the identity provider is deleted from
                  the server when this resource is deleted. Defaults to Delete.
                enum:
                - Orphan
                - Delete
                type: string
              displayName:
                type: string
              enabled:
                type: boolean
              firstBrokerLoginFlowAlias:
                type: string
