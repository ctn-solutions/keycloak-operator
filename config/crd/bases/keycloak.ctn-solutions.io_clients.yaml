---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: clients.keycloak.ctn-solutions.io
spec:
  group: keycloak.ctn-solutions.io
  names:
    categories:
    - keycloak
    kind: Client
    listKind: ClientList
    plural: clients
    shortNames:
    - kcclient
    singular: client
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clientId
      name: Client ID
      type: string
    - jsonPath: .spec.realm
      name: Realm
      type: string
    - jsonPath: .spec.keycloakRef.name
      name: Connection
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Client manages a client on a Keycloak server. The spec mirrors the Keycloak
          ClientRepresentation; see the Keycloak server documentation for field
          semantics.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ClientSpec defines the desired state of a Client. Fields mirror the
              Keycloak ClientRepresentation one-to-one. The client secret is never part
              of the spec: it is either injected from a Secret (secretRef) or exported to
              one (secretOutput).
            properties:
              adminUrl:
                type: string
              adoptionPolicy:
                description: |-
                  AdoptionPolicy controls the behaviour when a client with the same
                  clientId already exists. Defaults to CreateOnly.
                enum:
                - CreateOnly
                - Adopt
                - FailIfExists
                type: string
              alwaysDisplayInConsole:
                type: boolean
              attributes:
                additionalProperties:
                  type: string
                type: object
              authenticationFlowBindingOverrides:
                additionalProperties:
                  type: string
                description: |-
                  AuthenticationFlowBindingOverrides maps flow bindings such as "browser"
                  or "grant" to flow aliases.
                type: object
              authorizationServicesEnabled:
                type: boolean
              baseUrl:
                type: string
              bearerOnly:
                type: boolean
              clientAuthenticatorType:
                description: |-
                  ClientAuthenticatorType is for example "client_secret" or
                  "client_jwt".
                type: string
              clientId:
                description: ClientID is the client identifier used in OIDC/SAML requests.
                minLength: 1
                type: string
              consentRequired:
                type: boolean
              consentScreenText:
                type: string
              defaultClientScopes:
                description: |-
                  DefaultClientScopes lists client scope names granted by default. The
                  operator enforces the exact set on the server.
                items:
                  type: string
                type: array
              deletionPolicy:
                description: |-
                  DeletionPolicy controls whether the client is deleted from the server
                  when this resource is deleted. Defaults to Delete.
                enum:
                - Orphan
                - Delete
                type: string
              description:
                type: string
              directAccessGrantsEnabled:
                type: boolean
              displayOnConsentScreen:
                type: boolean
              enabled:
                type: boolean
              frontchannelLogout:
                type: boolean
              fullScopeAllowed:
                type: boolean
              implicitFlowEnabled:
                type: boolean
              keycloakRef:
                description: KeycloakRef points to the KeycloakConnection managing
                  this client.
                properties:
                  name:
                    description: Name of the KeycloakConnection resource.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              name:
                type: string
              nodeReRegistrationTimeout:
                type: integer
              optionalClientScopes:
                description: |-
                  OptionalClientScopes lists client scope names the client may request.
                  The operator enforces the exact set on the server.
                items:
                  type: string
                type: array
              protocol:
                description: Protocol is "openid-connect" or "saml".
                enum:
                - openid-connect
                - saml
                type: string
              protocolMappers:
                items:
                  description: ProtocolMapper mirrors the Keycloak ProtocolMapperRepresentation.
                  properties:
                    config:
                      additionalProperties:
                        type: string
                      type: object
                    consentRequired:
                      type: boolean
                    name:
                      type: string
                    protocol:
                      type: string
                    protocolMapper:
                      type: string
                  type: object
                type: array
              publicClient:
                type: boolean
              realm:
                description: Realm is the name of the realm the client lives in.
                minLength: 1
                type: string
              redirectUris:
                items:
                  type: string
                type: array
              rootUrl:
                type: string
              secretOutput:
                description: |-
                  SecretOutput exports the effective client secret to a Secret in the
                  same namespace so applications can mount it. The operator owns the
                  referenced Secret and garbage-collects it with the Client resource.
                properties:
                  key:
                    description: Key within the Secret. Defaults to "clientSecret"
                      for client secrets.
                    minLength: 1
                    type: string
                  name:
                    description: Name of the Secret.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              secretRef:
                description: |-
                  SecretRef injects the client secret from a Secret in the same
                  namespace. When set, the operator keeps the server-side secret in sync
                  with the Secret value.
                properties:
                  key:
                    description: Key within the Secret. Defaults to "clientSecret"
                      for client secrets.
                    minLength: 1
                    type: string
                  name:
                    description: Name of the Secret.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              serviceAccountsEnabled:
                type: boolean
              standardFlowEnabled:
                type: boolean
              surrogateAuthRequired:
                type: boolean
              webOrigins:
                items:
                  type: string
                type: array
            required:
            - clientId
            - keycloakRef
            - realm
            type: object
          status:
            description: ClientStatus reports the observed state of a Client.
            properties:
              conditions:
                description: Conditions report the outcome of the latest reconciliation.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the generation most recently processed.
                format: int64
                type: integer
              secretName:
                description: |-
                  SecretName is the name of the Secret written by secretOutput, when
                  configured.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
